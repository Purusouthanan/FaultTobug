roles:
  Admin:
    - resource: "*"
      action: "*"
      decision: "Allow"
  Doctor:
    - resource: "patients"
      action: "view"
      decision: "Allow"
    - resource: "patients"
      action: "create"
      decision: "Allow"
    - resource: "prescriptions"
      action: "view"
      decision: "Allow"
    - resource: "prescriptions"
      action: "modify"
      decision: "Allow"
  Nurse:
    - resource: "patients"
      action: "view"
      decision: "Allow"
    - resource: "prescriptions"
      action: "view"
      decision: "Allow"
    - resource: "prescriptions"
      action: "modify"
      decision: "Deny"
  Receptionist:
    - resource: "patients"
      action: "view"
      decision: "Allow"
    - resource: "appointments"
      action: "view"
      decision: "Allow"
    - resource: "appointments"
      action: "create"
      decision: "Allow"
    - resource: "prescriptions"
      action: "view"
      decision: "Deny"
  Billing Clerk:
    - resource: "patients"
      action: "view"
      decision: "Allow"
    - resource: "billing"
      action: "view"
      decision: "Allow"
    - resource: "billing"
      action: "create"
      decision: "Allow"
    - resource: "prescriptions"
      action: "*"
      decision: "Deny"
    - resource: "prescriptions"
      action: "view"
      decision: "Deny"
    - resource: "prescriptions"
      action: "modify"
      decision: "Deny"
    - resource: "patients"
      action: "create"
      decision: "Deny"
    - resource: "patients"
      action: "delete"
      decision: "Deny"

