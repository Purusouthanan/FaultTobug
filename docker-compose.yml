version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: faulttrace_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faulttrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faulttrace}
      POSTGRES_DB: ${POSTGRES_DB:-faulttrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
